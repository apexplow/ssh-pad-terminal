name: CI

# Issue #57 (open-source-readiness P1): unit tests + assembleDebug/Release
# on every PR and on push to main. The release build is verified against a
# throwaway keystore generated inside the job — no secrets live in this
# workflow; the production release keystore is supplied via GitHub Actions
# secrets only at the maintainer's publishing pipeline (out of scope here).
#
# Why we verify assembleRelease in CI: Issue #33 turned on R8 + resource
# shrinking for release. The proguard-rules.pro keep set for SSHJ /
# BouncyCastle / Termux is fragile — a transitive dep upgrade can silently
# remove a reflectively-accessed class. Catching that here is cheaper than
# on a real device.

on:
  pull_request:
  # Direct merges to main (e.g. the release workflow's
  # `git push origin main` step) bypass PR review, so CI must validate
  # them. Without this trigger, a broken commit landed on main via the
  # release workflow and was only caught when the next PR branched off
  # it (PR #74 / run 30426730346). `cache-read-only: ${{ github.ref !=
  # 'refs/heads/main' }}` already correctly switches the Gradle cache
  # to writable on a push-to-main.
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run for the same branch when a new commit lands —
# saves CI minutes when a PR gets pushed to repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fail-fast gate: refuses to run the (≈5 min) test + assemble matrix
  # when the PR branch is behind origin/main. Same `--left-right --count`
  # semantics as the release workflow's merge-conflict probe (release.yml
  # line 190+); column 1 = commits only in HEAD, column 2 = commits only
  # in origin/main (i.e. how far behind HEAD is).
  #
  # Branch protection on main should require this job (or the whole
  # "CI" workflow) so a red `behind-main` blocks the merge button —
  # that wiring lives on the GitHub side, not in the repo.
  behind-main:
    name: Branch is up-to-date with main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits behind origin/main
        run: |
          git fetch origin main
          BEHIND=$(git rev-list --left-right --count HEAD...origin/main | awk '{print $2}')
          AHEAD=$(git rev-list --left-right --count HEAD...origin/main | awk '{print $1}')
          echo "Ahead of main: $AHEAD; behind main: $BEHIND."
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::This branch is $BEHIND commit(s) behind origin/main."
            echo "::error::Merge or rebase origin/main into this branch, then push."
            exit 1
          fi

  build:
    name: Unit tests + assemble
    needs: behind-main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temurin JDK 21 — matches what `gradlew` ships locally and what
      # Robolectric 4.16+ requires for the SDK 36 sandbox.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK: platform 36 + build-tools 36.0.0 (matches the
      # compileSdk = 36 / build-tools 36.0.0 documented in README §
      # "环境要求"). `android-commands` is the matcher for adb / sdkmanager
      # being on PATH; we don't run adb in CI but the action still wires
      # up sdkmanager + licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Cache Gradle dependencies + the custom gradlew's downloaded Gradle
      # distribution under .gradle/. Read-only on PR branches (save cache
      # bytes), write on main.
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Branch-suffixed version name (Issue #80 follow-up):
      #   - main branch           → "<base>-debug" / "<base>-release"
      #   - any other branch      → "<sanitized-branch>-debug-<base>"
      #                              / "<sanitized-branch>-release-<base>"
      # where <sanitized-branch> is the branch name with `/` replaced
      # by `-` (AGP restricts versionName to [0-9A-Za-z.-+]). The
      # `<base>` is read straight from the hardcoded `versionName = "..."`
      # in app/build.gradle.kts so the suffix tracks the in-tree value
      # automatically — when the release workflow bumps it, the next
      # CI run on a non-main branch picks up the new base.
      - name: Compute branch-suffixed version
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          SANITIZED=$(echo "$BRANCH" | tr '/' '-')
          # Match the `versionName = "..."` assignment line (not the
          # kdoc comment that mentions `versionName`). The `[[:space:]]*`
          # tolerates any indentation; the `= "$VERSION"` capture
          # group is the only thing sed needs to extract.
          BASE=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [ "$BRANCH" = "main" ]; then
            DEBUG_VERSION="${BASE}-debug"
            RELEASE_VERSION="${BASE}-release"
          else
            DEBUG_VERSION="${SANITIZED}-debug-${BASE}"
            RELEASE_VERSION="${SANITIZED}-release-${BASE}"
          fi
          {
            echo "debug=$DEBUG_VERSION"
            echo "release=$RELEASE_VERSION"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH → debug=$DEBUG_VERSION, release=$RELEASE_VERSION"

      # assembleDebug is the primary signal — compiles the app, the test
      # sources, and runs the unit-test suite. Robolectric SDK [34, 35, 36]
      # matrix runs each test three times; expect ~5 min cold, <30 s warm.
      #
      # Note: `:app:testDebugUnitTest` does NOT pass `-PciVersionName=`
      # — tests don't care about versionName, and skipping the override
      # here means a unit-test run that fails for unrelated reasons can
      # still be diagnosed without the CI version suffix muddying logs.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PciVersionName=${{ steps.version.outputs.debug }}

      # assembleRelease verifies the R8 / shrinker path end-to-end so a
      # transitive dep upgrade can't silently strip a reflectively-accessed
      # SSHJ / BouncyCastle / Termux class. Generate a throwaway keystore
      # inside the job — no secrets, and the artifact is dropped before
      # the runner is reclaimed.
      #
      # Use an absolute path under /tmp: AGP's `file(KEYSTORE_PATH)` call
      # resolves the keystore path against the **module** directory
      # (`app/`), not the repo root, so a relative path like
      # `.ci/release.jks` would resolve to `app/.ci/release.jks` and
      # fail with "not found". The keytool step runs from the repo
      # root, so a repo-root-relative path would mismatch. /tmp is
      # unambiguous for both sides.
      - name: Generate throwaway keystore for CI release build
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/hanterm-ci-release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 365 \
            -alias hanterm-ci \
            -storepass hanterm-ci -keypass hanterm-ci \
            -dname "CN=HanTerm CI,O=OSS,C=US"

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease -PciVersionName=${{ steps.version.outputs.release }}
        env:
          KEYSTORE_PATH: /tmp/hanterm-ci-release.jks
          KEYSTORE_PASSWORD: hanterm-ci
          KEY_ALIAS: hanterm-ci
          KEY_PASSWORD: hanterm-ci

      # Upload test report even on failure — the per-test HTML / XML is
      # the only way to see WHICH test broke on CI.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # Encode the branch-suffixed versionName into the artifact
          # name so two PR branches' debug APKs are easy to tell apart
          # in the Actions UI (and any downloader script that globs
          # the artifact list can branch on the prefix).
          name: app-debug-${{ steps.version.outputs.debug }}-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.release }}-${{ github.run_id }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14