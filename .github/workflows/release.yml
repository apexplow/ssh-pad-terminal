name: Release

# Trigger manually. Version auto-increments from app/build.gradle.kts
# (patch +1), or override with a manual version.
#
# All release tags are prefixed with "rtag" (e.g. rtag0.1.1).
#
# Flow:
#   1. Bump versionName (patch+1) and versionCode (+1) in build.gradle.kts
#   2. Commit & push the version bump
#   3. Build release APK (fail early, before any tag is created)
#   4. Tag the commit as v{version}
#   5. Create GitHub Release and attach the APK
#   6. Check merge conflicts with main
#   7. Clean → merge into main. Conflicts → delete release + tag, fail.
#   8. On ANY failure after tag creation → delete release + tag.
#
# Only one release workflow runs at a time.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to auto-increment patch)'
        required: false
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, release & merge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Release workflow is forbidden on 'main' branch. Use a dedicated release branch (e.g. release/v1)."
            exit 1
          fi
          echo "Running release from branch: ${{ github.ref_name }}"

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            NEW_VERSION="${{ inputs.version }}"
            echo "Using manual version: $NEW_VERSION"
          else
            CURRENT_VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Auto-incremented: $CURRENT_VERSION → $NEW_VERSION"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          CURRENT_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          NEW_CODE=$((CURRENT_CODE + 1))
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "versionCode: $CURRENT_CODE → $NEW_CODE"

      - name: Bump version in build.gradle.kts
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ steps.version.outputs.version }}"/' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]\+/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          git diff app/build.gradle.kts

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/hanterm-release.jks

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: /tmp/hanterm-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # AGP 8.x removed `outputFileName = ...` on `ApplicationBuildType`
      # (deprecated since 4.2, removed in 8.0). The simplest portable
      # substitute is a post-assemble rename — the build script stays
      # idiomatic and the GitHub Release asset keeps its human-readable
      # filename (e.g. HanTerm-0.1.5.apk).
      - name: Rename release APK
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            mv "$f" "HanTerm-${{ steps.version.outputs.version }}.apk"
          done

      - name: Create and push tag
        id: tag
        run: |
          TAG="rtag${{ steps.version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Collect changelog (PRs + issues since last release)
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the previous rtag* tag (excluding the one we just created).
          PREV_TAG=$(git tag --list 'rtag*' --sort=-creatordate | grep -v "^$TAG$" | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            NOTES="Initial release of HanTerm Android SSH client.

          No prior release tag found — this release bundles the full history of merged PRs and closed issues."
          else
            RANGE="$PREV_TAG..HEAD"

            # Merged PRs since previous release
            PRS=$(gh pr list --state merged --base main --limit 200 --json number,title,labels \
              --template '{{range .}}#{{.number}} {{.title}}{{"\n"}}{{end}}' || true)

            # Issues closed in the same range
            ISSUES=$(gh issue list --state closed --limit 200 \
              --template '{{range .}}#{{.number}} {{.title}}{{"\n"}}{{end}}' || true)

            if [ -z "$(echo "$PRS" | tr -d '[:space:]')" ] && [ -z "$(echo "$ISSUES" | tr -d '[:space:]')" ]; then
              NOTES="No new merged PRs or closed issues since ${PREV_TAG}."
            else
              NOTES="Changes since [${PREV_TAG}](https://github.com/${{ github.repository }}/releases/tag/${PREV_TAG}):

          "

              if [ -n "$(echo "$PRS" | tr -d '[:space:]')" ]; then
                NOTES="${NOTES}### Merged PRs
          ${PRS}
          "
              fi

              if [ -n "$(echo "$ISSUES" | tr -d '[:space:]')" ]; then
                NOTES="${NOTES}### Closed Issues
          ${ISSUES}
          "
              fi
            fi
          fi

          echo "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release-notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/release/HanTerm-${{ steps.version.outputs.version }}.apk"
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            "$APK_PATH"

      - name: Check merge conflicts with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch origin main
          git checkout -B _merge-check origin/main
          MERGE_OUT=$(git merge --no-commit --no-ff "${{ steps.tag.outputs.tag }}" 2>&1)
          MERGE_RC=$?
          set -e
          echo "$MERGE_OUT"
          # Detect conflict regardless of exit code: conflict markers
          # appear in any file under .git/, and git exits with 1 on
          # conflict. But some git builds also exit nonzero on transient
          # errors; double-check by looking for unmerged paths.
          if [ "$MERGE_RC" -ne 0 ] || git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Merge conflicts with main. Deleting release and tag."
            git merge --abort 2>/dev/null || true
            gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag
            exit 1
          fi
          git merge --abort 2>/dev/null || true
          echo "No merge conflicts with main."

      - name: Merge release into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff "${{ steps.tag.outputs.tag }}" -m "Merge release ${{ steps.tag.outputs.tag }}"
          git push origin main

      - name: Cleanup on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Workflow failed — cleaning up release and tag."
          gh release delete "rtag${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true
